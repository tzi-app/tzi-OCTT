[pytest]
asyncio_default_fixture_loop_scope = function

# Test settings. "D:" makes each one a default: an environment variable of the same name
# overrides it. CSMS_SETUP.md explains what your CSMS needs for each setting.
env =
    # CSMS endpoints
    D:CSMS_ADDRESS=wss://localhost:9000
    D:CSMS_TRIGGER_ADDRESS=http://localhost:5001
    D:CSMS_ACTION_TIMEOUT=30
    D:CSMS_NO_ACTION_WAIT=5

    # Charging stations to register in the CSMS, and their Basic Auth password
    D:CP201_SP1=CP201_SP1
    D:CP201_SP2=CP202_SP2
    D:CP201_SP3=CP202_SP3
    D:CP21_SP1=CP21_SP1
    D:CP21_SP2=CP21_SP2
    D:CP21_SP3=CP21_SP3
    D:CP16_SP1=CP16_SP1
    D:CP16_SP2=CP16_SP2
    D:CP16_SP3=CP16_SP3
    D:BASIC_AUTH_CP_PASSWORD=test1234

    # ID tokens to add to the CSMS
    D:VALID_ID_TOKEN=TAG-001
    D:VALID_ID_TOKEN_TYPE=ISO14443
    D:VALID_ID_TOKEN_2=100000C39B
    D:VALID_ID_TOKEN_TYPE_2=Central
    D:VALID_IDTOKEN_IDTOKEN=100000C01
    D:VALID_IDTOKEN_TYPE=Central
    D:INVALID_ID_TOKEN=100000C02
    D:INVALID_ID_TOKEN_TYPE=ISO14443
    D:BLOCKED_ID_TOKEN=100000C06
    D:BLOCKED_ID_TOKEN_TYPE=Central
    D:EXPIRED_ID_TOKEN=100000C07
    D:EXPIRED_ID_TOKEN_TYPE=Central
    D:GROUP_ID=GROUP001
    D:MASTERPASS_ID_TOKEN=MASTERC47
    D:MASTERPASS_ID_TOKEN_TYPE=Central
    D:MASTERPASS_GROUP_ID=GROUP001
    D:EMAID_ID_TOKEN=EMAID001
    D:EMAID_ID_TOKEN_TYPE=eMAID
    D:LOCAL_LIST_VERSION=1

    # Prepaid cards and VAT numbers to add to the CSMS (block C, OCPP 2.1)
    D:PREPAID_ID_TOKEN=PREPAID001
    D:PREPAID_ID_TOKEN_TYPE=ISO14443
    D:PREPAID_NO_CREDIT_ID_TOKEN=PREPAID002
    D:PREPAID_NO_CREDIT_ID_TOKEN_TYPE=ISO14443
    D:VALID_VAT_NUMBER=NL123456789B01
    D:INVALID_VAT_NUMBER=NL000000000B00

    # Ad hoc payments (block C, OCPP 2.1). The CSMS has the QR code URL template
    # <QR_CODE_BASE_URL>/{chargingstationid}/{evse}/{totp}/{version} and the shared secret.
    D:CARD_LAST_4_DIGITS=1234
    D:QR_CODE_BASE_URL=https://qr.example.com
    D:QR_CODE_SHARED_SECRET=mysharedsecret

    # Station hardware
    D:CONFIGURED_EVSE_ID=1
    D:CONFIGURED_CONNECTOR_ID=1
    D:CONFIGURED_CONNECTOR_TYPE=cType2
    D:CONFIGURED_NUMBER_OF_EVSES=1
    D:CONFIGURED_NUMBER_PHASES=3

    # Timing and metering
    D:CONFIGURED_HEARTBEAT_INTERVAL=10
    D:TRANSACTION_DURATION=5
    D:CONFIGURED_EV_CONNECTION_TIMEOUT=5
    D:SAMPLED_METER_VALUES_INTERVAL=1
    D:CLOCK_ALIGNED_METER_VALUES_INTERVAL=1
    D:TX_ENDED_METER_VALUES_INTERVAL=1

    # Network profile (block B)
    D:CONFIGURED_CONFIGURATION_SLOT=1
    D:CONFIGURED_MESSAGE_TIMEOUT=30
    D:CONFIGURED_OCPP_INTERFACE=Wired0
    D:CONFIGURED_SECURITY_PROFILE=2
    D:CONFIGURED_NON_ACTIVE_CONFIGURATION_SLOT=2
    D:CONFIGURED_APN=internet.example.com
    D:CONFIGURED_APN_USERNAME=apn-user
    D:CONFIGURED_APN_PASSWORD=apn-password

    # Certificate signing requests of the station (block A, OCPP 2.1)
    D:CONFIGURED_CSR_COUNTRY=NL
    D:CONFIGURED_CSR_ORGANIZATION=TZI Test
    D:CONFIGURED_CSR_ORGANIZATIONAL_UNIT=OCTT

    # ISO 15118-20 (blocks K and Q, OCPP 2.1): the EVCCID of the mock EV
    D:CONFIGURED_EVCCID=EVCC00112233AABB

    # Smart charging (block K, OCPP 2.1)
    D:CONFIGURED_CHARGING_PROFILE_ID=1
    D:CONFIGURED_STACK_LEVEL=0
    D:CONFIGURED_CHARGING_PROFILE_PURPOSE=TxDefaultProfile
    D:CONFIGURED_CHARGING_RATE_UNIT=A
    D:CONFIGURED_CHARGING_SCHEDULE_DURATION=300
    D:CONFIGURED_RECURRENCY_KIND=Daily
    D:CONFIGURED_CHARGING_LIMIT_SOURCE=CSO
    D:CONFIGURED_DYNAMIC_PROFILE_UPDATE_INTERVAL=5

    # Firmware management (block L, OCPP 2.1)
    D:CONFIGURED_FIRMWARE_LOCATION=https://firmware.example.com/tzi/firmware-2.1.0.bin

    # ISO 15118 certificate installation (block M, OCPP 2.1): <Configured list EMA IDs>
    D:CONFIGURED_PRIORITIZED_EMAIDS=EMAID001,EMAID002,EMAID003

    # Diagnostics (block N, OCPP 2.1): where the Test System is asked to upload a log
    D:CONFIGURED_LOG_LOCATION=https://logs.example.com/tzi-octt/

    # Display messages (block O, OCPP 2.1)
    D:CONFIGURED_DISPLAY_MESSAGE_ID=1
    D:CONFIGURED_DISPLAY_MESSAGE_PRIORITY=NormalCycle
    D:CONFIGURED_DISPLAY_MESSAGE_FORMAT=UTF8
    D:CONFIGURED_DISPLAY_MESSAGE_STATE=Idle
    D:CONFIGURED_DISPLAY_MESSAGE_LANGUAGE=en
    D:CONFIGURED_DISPLAY_MESSAGE_OTHER_LANGUAGE=nl

    # Data transfer (block P)
    D:CONFIGURED_VENDOR_ID=tzi.app
    D:CONFIGURED_MESSAGE_ID=TestMessage

    # TLS certificates, relative to the repository root
    D:TLS_CA_CERT=certs/ca.pem
    D:TLS_CLIENT_CERT=certs/client.pem
    D:TLS_CLIENT_KEY=certs/client.key
    D:TLS_INVALID_CLIENT_CERT=certs/invalid_client.pem
    D:TLS_INVALID_CLIENT_KEY=certs/invalid_client.key
